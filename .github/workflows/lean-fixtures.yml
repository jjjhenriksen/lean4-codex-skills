name: Native Lean skill fixtures
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: skills/lean4-checkpoint/examples/proof-audit
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - run: python -m unittest discover -s tests -v
